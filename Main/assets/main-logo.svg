<!--
Made by Claude
-->
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>

    <!-- Star glows -->
    <radialGradient id="glow-claude" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4956a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4956a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-chatgpt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gemini" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-copilot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b61ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <style>
    .line { stroke-dasharray: 300; stroke-dashoffset: 300; animation: drawLine 1.8s ease forwards; }
    .line-1 { animation-delay: 0.2s; }
    .line-2 { animation-delay: 0.5s; }
    .line-3 { animation-delay: 0.8s; }
    .line-4 { animation-delay: 1.1s; }
    .line-5 { animation-delay: 1.4s; }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    .star { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .star-claude  { animation-delay: 0s; }
    .star-chatgpt { animation-delay: 0.75s; }
    .star-gemini  { animation-delay: 1.5s; }
    .star-copilot { animation-delay: 2.25s; }

    @keyframes pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(0.85); }
    }

    .label { font-family: Georgia, serif; font-size: 11px; font-style: italic; fill-opacity: 0; animation: fadeIn 0.6s ease forwards; }
    .label-1 { animation-delay: 1.8s; }
    .label-2 { animation-delay: 2.0s; }
    .label-3 { animation-delay: 2.2s; }
    .label-4 { animation-delay: 2.4s; }

    @keyframes fadeIn { to { fill-opacity: 0.55; } }

    .title { font-family: Georgia, serif; font-size: 15px; font-style: italic; fill: #f0ece4; fill-opacity: 0; animation: fadeIn 1s ease forwards; animation-delay: 2.8s; }
  </style>

  <!-- Background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Subtle star field -->
  <circle cx="60"  cy="50"  r="1" fill="#fff" opacity="0.15"/>
  <circle cx="340" cy="80"  r="0.8" fill="#fff" opacity="0.1"/>
  <circle cx="310" cy="340" r="1.2" fill="#fff" opacity="0.12"/>
  <circle cx="80"  cy="320" r="0.9" fill="#fff" opacity="0.1"/>
  <circle cx="200" cy="40"  r="0.7" fill="#fff" opacity="0.08"/>
  <circle cx="370" cy="200" r="1"   fill="#fff" opacity="0.1"/>
  <circle cx="30"  cy="200" r="0.8" fill="#fff" opacity="0.08"/>

  <!-- Constellation lines -->
  <!-- Claude → ChatGPT -->
  <line class="line line-1" x1="150" y1="130" x2="260" y2="150" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
  <!-- ChatGPT → Gemini -->
  <line class="line line-2" x1="260" y1="150" x2="270" y2="260" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
  <!-- Gemini → Copilot -->
  <line class="line line-3" x1="270" y1="260" x2="145" y2="265" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
  <!-- Copilot → Claude -->
  <line class="line line-4" x1="145" y1="265" x2="150" y2="130" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.15"/>
  <!-- Claude → Gemini (cross) -->
  <line class="line line-5" x1="150" y1="130" x2="270" y2="260" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.07"/>

  <!-- Claude — top left -->
  <circle cx="150" cy="130" r="22" fill="url(#glow-claude)" filter="url(#blur-sm)"/>
  <circle class="star star-claude" cx="150" cy="130" r="7" fill="#d4956a"/>
  <circle cx="150" cy="130" r="3.5" fill="#f0ece4"/>
  <text class="label label-1" x="125" y="115" fill="#d4956a" text-anchor="middle">claude</text>

  <!-- ChatGPT — top right -->
  <circle cx="260" cy="150" r="20" fill="url(#glow-chatgpt)" filter="url(#blur-sm)"/>
  <circle class="star star-chatgpt" cx="260" cy="150" r="6" fill="#10a37f"/>
  <circle cx="260" cy="150" r="3" fill="#f0ece4"/>
  <text class="label label-2" x="282" y="138" fill="#10a37f" text-anchor="middle">chatgpt</text>

  <!-- Gemini — bottom right -->
  <circle cx="270" cy="260" r="20" fill="url(#glow-gemini)" filter="url(#blur-sm)"/>
  <circle class="star star-gemini" cx="270" cy="260" r="6" fill="#4285f4"/>
  <circle cx="270" cy="260" r="3" fill="#f0ece4"/>
  <text class="label label-3" x="295" y="275" fill="#4285f4" text-anchor="middle">gemini</text>

  <!-- Copilot — bottom left -->
  <circle cx="145" cy="265" r="20" fill="url(#glow-copilot)" filter="url(#blur-sm)"/>
  <circle class="star star-copilot" cx="145" cy="265" r="6" fill="#7b61ff"/>
  <circle cx="145" cy="265" r="3" fill="#f0ece4"/>
  <text class="label label-4" x="118" y="280" fill="#7b61ff" text-anchor="middle">copilot</text>

  <!-- Title -->
  <text class="title" x="200" y="360" text-anchor="middle" letter-spacing="2">constellation</text>
</svg>
