<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e1a16"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4956a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4956a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c99a"/>
      <stop offset="100%" stop-color="#d4956a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- Soft glow -->
  <circle cx="100" cy="100" r="80" fill="url(#glowGrad)"/>

  <!-- Outer decorative ring (partial arc, top-right) -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#d4956a" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="180 310" stroke-dashoffset="-40"/>

  <!-- Inner decorative ring (partial arc, bottom-left) -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#e8c99a" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="120 310" stroke-dashoffset="100"/>

  <!-- The "C" letterform — drawn as a bold open arc -->
  <path d="
    M 148 72
    A 58 58 0 1 0 148 128
  " fill="none" stroke="url(#arcGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Small accent dot at arc opening top -->
  <circle cx="148" cy="72" r="5" fill="#e8c99a"/>
  <!-- Small accent dot at arc opening bottom -->
  <circle cx="148" cy="128" r="5" fill="#d4956a"/>

  <!-- Wordmark -->
  <text x="100" y="185" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8a8480" text-anchor="middle" letter-spacing="3">claude</text>
</svg>
