  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      position: absolute;
      top: 0;
      animation: fadeIn 1s ease forwards;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 40px;
      padding: 0;
      margin: 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #4da3ff;
      text-shadow: 0 0 10px #4da3ff;
    }

    .logo {
      font-size: 90px;
      margin-bottom: 20px;
      animation: fadeIn 1.2s ease forwards;
    }

    .tagline {
      font-size: 1.5rem;
      opacity: 0.85;
      animation: fadeIn 1.6s ease forwards;
    }
  </style>
</head>
